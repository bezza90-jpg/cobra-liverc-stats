name: Update and publish COBRA statistics

on: { push: { branches: [main] }, workflow_dispatch: {}, schedule: [{ cron: "17 4 * * *" }] }

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cobra-statistics-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check LiveRC and rebuild statistics
        run: npm run update

      - name: Validate dashboard data
        run: npm run check

      - name: Save updated results
        run: |
          if [[ -n "$(git status --porcelain data/raw public/data)" ]]; then
            git config user.name "COBRA statistics updater"
            git config user.email "actions@users.noreply.github.com"
            git add data/raw public/data
            git commit -m "Update LiveRC statistics"
          fi
          # Website edits may arrive while this job runs. Rebase generated data
          # onto the latest main before publishing the freshly updated site.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "The website changed repeatedly while results were being saved. Run this workflow again." >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
