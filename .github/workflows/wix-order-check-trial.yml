name: Wix order check trial

on:
  workflow_dispatch:
  schedule:
    - cron: "31,36,41 1 7 11 *"

permissions: {}

concurrency:
  group: cobra-wix-order-check-trial
  cancel-in-progress: false

jobs:
  check-closed-event:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      COBRA_ORDER_POLL_TRIAL_KEY: ${{ secrets.COBRA_ORDER_POLL_TRIAL_KEY }}
    steps:
      - name: Check the closed Wix test event
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHmac} from 'node:crypto';
          if (Date.now() >= Date.parse('2026-11-07T02:00:00Z')) throw Error('Trial window has ended.');
          const key = process.env.COBRA_ORDER_POLL_TRIAL_KEY;
          if (!key || key.length < 32) throw Error('Wix trial key is missing.');
          const time = String(Date.now());
          const signature = createHmac('sha256',key).update('cobra-order-poll-v1:'+time).digest('hex');
          const response = await fetch('https://headless-bkqwbmqsasx-bezza90-1407.wix-site-host.com/api/poll-booking-orders',{
            method:'POST', redirect:'error', signal:AbortSignal.timeout(30000),
            headers:{'x-cobra-poll-time':time,'x-cobra-poll-signature':signature},
          });
          if (!response.ok) throw Error('Wix order check returned HTTP '+response.status);
          const result = await response.json();
          if (result.confirmed !== 1 || result.ignored !== 0 || result.review !== 0 || result.retry !== 0) {
            throw Error('Unexpected Wix trial counts.');
          }
          console.log('Closed event: 1 verified order, 0 ignored, 0 review, 0 retry.');
          NODE

