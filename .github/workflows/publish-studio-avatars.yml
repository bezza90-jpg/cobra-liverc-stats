name: Publish checked Cutout Studio photos
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cobra-statistics-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Look for an explicit new studio approval
        id: pending
        run: echo "pending=$(python3 scripts/publish-studio-avatars.py --check)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.pending == 'yes'
        with:
          python-version: '3.12'
      - name: Prepare only the cutouts checked by Matt
        if: steps.pending.outputs.pending == 'yes'
        run: |
          python -m pip install pillow
          python -m unittest discover -s scripts -p 'test*studio*.py'
          python scripts/publish-studio-avatars.py
          python scripts/verify-avatar-review.py
      - name: Save exact approved assets and policy
        if: steps.pending.outputs.pending == 'yes'
        run: |
          git config user.name 'COBRA approved photo publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/car-avatars public/assets/car-avatar-thumbnails public/data/car-avatars.json public/data/car-avatar-source-revisions.json public/data/car-avatar-manual-revisions.json public/data/car-avatar-review-policy.json public/data/car-avatar-processing.json
          git diff --cached --quiet || git commit -m 'Publish checked Cutout Studio photos [skip ci]'
          git push
      - uses: actions/configure-pages@v5
        if: steps.pending.outputs.pending == 'yes'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pending.outputs.pending == 'yes'
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.pending.outputs.pending == 'yes'
