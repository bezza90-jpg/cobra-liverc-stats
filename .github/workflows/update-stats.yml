name: Update and publish COBRA statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/London"
    # Sunday race afternoons, every 15 minutes. LiveRC calendar gates the expensive work.
    - cron: "7,22,37,52 15-17 * * 0"
      timezone: "Europe/London"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cobra-statistics-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether COBRA is racing today
        id: race_day
        if: github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 15-17 * * 0'
        run: node scripts/check-race-day.mjs | tee /dev/stderr | tail -n 1 >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check LiveRC and rebuild statistics
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          if [[ "${{ github.event.schedule }}" == '7,22,37,52 15-17 * * 0' ]]; then
            node scripts/update-liverc.mjs
          else
            npm run update
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Set up Python for approved car photos
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new approved car photos
        id: car_photos
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0'
        run: echo "pending=$(python scripts/sync-approved-avatars.py --check)" >> "$GITHUB_OUTPUT"

      - name: Cache background removal model
        if: steps.car_photos.outputs.pending == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.rembg/models
          key: cobra-car-avatar-u2netp-v1

      - name: Prepare approved car avatars
        if: steps.car_photos.outputs.pending == 'yes'
        run: |
          python -m pip install "rembg[cpu]" pillow
          python scripts/sync-approved-avatars.py

      - name: Rebuild illustrated podiums
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          node scripts/sync-manufacturer-logos.mjs
          node scripts/build-podium-defaults.mjs

      - name: Validate dashboard data
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        run: npm run check

      - name: Save updated results
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          if [[ -n "$(git status --porcelain data/raw public/data public/podium-defaults public/assets/manufacturers public/assets/car-avatars)" ]]; then
            git config user.name "COBRA statistics updater"
            git config user.email "actions@users.noreply.github.com"
            git add data/raw public/data public/podium-defaults public/assets/manufacturers public/assets/car-avatars
            git commit -m "Update LiveRC statistics"
            git push
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-17 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/deploy-pages@v4
