name: Update and publish COBRA statistics

on: { push: { branches: [main] }, workflow_dispatch: {}, schedule: [{ cron: "17 4 * * *" }] }

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cobra-statistics-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check LiveRC and rebuild statistics
        run: npm run update

      - name: Validate dashboard data
        run: npm run check

      - name: Save updated results
        run: |
          if [[ -n "$(git status --porcelain data/raw public/data)" ]]; then
            git config user.name "COBRA statistics updater"
            git config user.email "actions@users.noreply.github.com"
            git add data/raw public/data
            git commit -m "Update LiveRC statistics"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
