name: Update and publish COBRA statistics

on:
  workflow_dispatch:
    inputs:
      avatar_submission:
        description: 'Optional approved avatar submission ID to reprocess'
        required: false
        type: string
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/London"
    # Sunday race afternoons, every 15 minutes. LiveRC calendar gates the expensive work.
    - cron: "7,22,37,52 15-18 * * 0"
      timezone: "Europe/London"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  COBRA_AVATAR_SUBMISSION: ${{ inputs.avatar_submission || '' }}

concurrency:
  group: cobra-statistics-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Queued manager publishes must build the current branch, not the
          # triggering commit from before an earlier job saved generated data.
          ref: main
          fetch-depth: 0

      - name: Check whether COBRA is racing today
        id: race_day
        if: github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 15-18 * * 0'
        run: node scripts/check-race-day.mjs | tee /dev/stderr | tail -n 1 >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check LiveRC and rebuild statistics
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          if [[ "${{ github.event.schedule }}" == '7,22,37,52 15-18 * * 0' ]]; then
            node scripts/automation-run.mjs liverc
          else
            npm run update
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Set up Python for approved car photos
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new approved car photos
        id: car_photos
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0'
        run: |
          pending=$(python scripts/sync-approved-avatars.py --check)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Cache background removal model
        if: steps.car_photos.outputs.pending == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.rembg/models
          key: cobra-car-avatar-u2netp-v1

      - name: Prepare approved car avatars
        if: steps.car_photos.outputs.pending == 'yes'
        run: |
          python -m pip install "rembg[cpu]" pillow
          python scripts/sync-approved-avatars.py

      - name: Rebuild illustrated podiums
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          node scripts/automation-run.mjs podiums

      - name: Validate dashboard data
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        run: npm run check

      - name: Save updated results
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          if [[ -n "$(git status --porcelain data/raw public/data public/podium-defaults public/assets/manufacturers public/assets/car-avatars public/assets/car-avatar-thumbnails public/virtual-race-replay)" ]]; then
            git config user.name "COBRA statistics updater"
            git config user.email "actions@users.noreply.github.com"
            git add data/raw public/data public/podium-defaults public/assets/manufacturers public/assets/car-avatars public/assets/car-avatar-thumbnails public/virtual-race-replay
            git commit -m "Update LiveRC statistics"
            # A manager/user push can land while this job builds its data.
            # Never force-push: integrate it, validate again, then retry.
            for attempt in 1 2 3; do
              git fetch origin main
              before_rebase=$(git rev-parse HEAD)
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Concurrent changes conflict with generated data; stopping for review."
                exit 1
              fi
              if [[ "$(git rev-parse HEAD)" != "$before_rebase" ]]; then
                npm run check
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "Could not save generated data after three attempts."
                exit 1
              fi
            done
          fi

      - name: Cache chart sharing pages
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        id: chart_cache
        uses: actions/cache@v4
        with:
          path: public/lap-charts/share
          key: chart-shares-v1-${{ hashFiles('scripts/build-chart-shares.mjs', 'scripts/site-shell.mjs', 'docs/wix-menu-reference.json', 'public/virtual-race-replay/races/*.json') }}

      - name: Build chart sharing pages and preview images
        if: steps.chart_cache.outputs.cache-hit != 'true' && (github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes')
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @napi-rs/canvas@0.1.100
          node scripts/build-chart-shares.mjs

      - name: Build current event sharing preview
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @napi-rs/canvas@0.1.100
          node scripts/build-event-preview.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        if: github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 15-18 * * 0' || steps.race_day.outputs.run == 'yes'
        uses: actions/deploy-pages@v4

      - name: Report avatar processing failures
        if: steps.car_photos.outputs.pending == 'yes'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('public/data/car-avatar-processing.json').read_text())
          failures = report.get('failures', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"\nAvatar updates: {report.get('updated', 0)}. Processing failures: {len(failures)}.\n")
              for pair, failure in failures.items():
                  summary.write(f"- {pair}: {failure['error']}\n")
          if failures:
              raise SystemExit('Some avatars need attention. Successful updates have been deployed; use Site Manager Approvals to retry.')
          PY
