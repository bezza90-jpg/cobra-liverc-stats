name: Recover GPW payment confirmations

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions: {}
concurrency:
  group: gpw-payment-recovery
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check unfinished GPW website bookings
        env:
          GPW_RECOVERY_TOKEN: ${{ secrets.GPW_RECOVERY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://booking.cobracardiff.co.uk/api/gpw-payment-recovery', {
            method: 'POST',
            redirect: 'error',
            headers: { 'x-cobra-gpw-recovery': process.env.GPW_RECOVERY_TOKEN },
            signal: AbortSignal.timeout(180000)
          });
          if (!response.headers.get('content-type')?.includes('application/json')) throw Error('GPW recovery returned HTTP ' + response.status);
          const summary = await response.json();
          console.log({ checked: summary.checked, paid: summary.paid, emailsSent: summary.emailsSent, needsReview: summary.needsReview });
          if (!response.ok || summary.needsReview !== 0) throw Error('GPW recovery needs attention.');
          NODE
